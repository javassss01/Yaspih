name: Rename file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "javassss01"
          git config user.email "javassss01@users.noreply.github.com"
          git mv smk-sma-yaspih-rajeg.html index.html
          git commit -m "Rename smk-sma-yaspih-rajeg.html to index.html"
          git push
